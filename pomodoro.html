<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro du HUB</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,sans-serif}.wrap{position:relative;isolation:isolate;width:100%;height:100%;background:#cbb79d;overflow:hidden;color:#fffaf3}.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1;object-fit:cover}main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(12px,7vw,26px) 8px 15px}.modes{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:8px}button{font:600 clamp(10px,4.5vw,14px)/1 Arial,sans-serif;cursor:pointer;border:1.5px solid #fffaf3;color:inherit;background:transparent;border-radius:25px;padding:6px 10px}.modes button[aria-pressed=false]{color:#493126;border-color:#493126}.modes button[aria-pressed=true]{background:#fffaf3;color:#6b503c;border-color:#fffaf3}.bottom{width:100%;text-align:center}.time{font-size:clamp(38px,25vw,85px);font-weight:700;letter-spacing:-.055em;line-height:1.08;font-variant-numeric:tabular-nums;margin:0 0 12px}.controls{display:flex;align-items:center;justify-content:center;gap:8px}.start{background:#fffaf3;color:#4e382c;border:0;width:62%;padding:9px 3px}.icon{padding:0;border:0;font-size:clamp(18px,10vw,29px);line-height:1}.settings{position:absolute;inset:8px;background:#51362af5;padding:14px;z-index:2;display:none;color:#fffaf3;text-align:center}.settings.open{display:block}.settings label{display:block;font-size:11px;margin:12px 0}.settings input{width:48px;margin-left:5px;padding:4px;border:0;background:#f4e8d5;color:#493126}.settings button{margin-top:10px}</style><div class="wrap"><img class="scene" src="dunes.jpg" alt=""><main><nav class="modes" aria-label="Mode"><button data-mode="0" aria-pressed="true">Pomodoro</button><button data-mode="1" aria-pressed="false">Pause courte</button><button data-mode="2" aria-pressed="false">Pause longue</button></nav><div class="bottom"><p class="time" id="time" role="timer">25:00</p><div class="controls"><button class="start" id="start">Démarrer</button><button class="icon" id="reset" aria-label="Réinitialiser">↻</button><button class="icon" id="gear" aria-label="Réglages">⚙</button></div></div></main><form class="settings" id="settings"><strong>Durées</strong><label>Focus <input id="focus" type="number" min="1" max="120" value="25"> min</label><label>Pause courte <input id="short" type="number" min="1" max="60" value="5"> min</label><label>Pause longue <input id="long" type="number" min="1" max="60" value="15"> min</label><button>Enregistrer</button></form></div><script>let mins=[25,5,15],mode=0,left=1500,end=0,running=false;const t=document.getElementById('time'),start=document.getElementById('start');function draw(){let s=running?Math.max(0,Math.ceil((end-Date.now())/1000)):left;t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');start.textContent=running?'Pause':'Démarrer';if(running&&s===0){running=false;left=0;start.textContent='Démarrer'}}setInterval(draw,250);start.onclick=()=>{if(running){left=Math.max(0,Math.ceil((end-Date.now())/1000));running=false}else{if(left===0)left=mins[mode]*60;end=Date.now()+left*1000;running=true}draw()};document.getElementById('reset').onclick=()=>{running=false;left=mins[mode]*60;draw()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=Number(b.dataset.mode);running=false;left=mins[mode]*60;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw()});document.getElementById('gear').onclick=()=>document.getElementById('settings').classList.toggle('open');document.getElementById('settings').onsubmit=e=>{e.preventDefault();mins=['focus','short','long'].map(id=>Math.max(1,Number(document.getElementById(id).value)||1));running=false;left=mins[mode]*60;document.getElementById('settings').classList.remove('open');draw()};draw()</script></html>
