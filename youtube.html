<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Musique du HUB</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #191919; }
    body { padding: 8px 0; font-family: Arial, sans-serif; color: #fffaf3; }
    .widget { width: 100%; min-width: 216px; margin: 0 auto; padding: 8px; border-radius: 12px; background: #51362a; box-shadow: 0 5px 16px #3b281b24; }
    .frame { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; background: #241910; }
    #player { width: 100%; height: 100%; }
    #player iframe { display: block; width: 100% !important; height: 100% !important; }
    .status { min-height: 16px; margin: 7px 2px 6px; overflow: hidden; color: #f4e8d5; font-size: 11px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
    button { min-width: 0; min-height: 34px; border: 1px solid #e7d5be; border-radius: 9px; background: #f4e8d5; color: #4e382c; cursor: pointer; font: 700 16px/1 Arial, sans-serif; }
    button:hover:not(:disabled) { background: #fffaf3; }
    button:focus-visible, input:focus-visible { outline: 2px solid #fffaf3; outline-offset: 2px; }
    button:disabled { cursor: wait; opacity: .55; }
    button[aria-pressed="true"] { border-color: #fffaf3; background: #cbb79d; color: #34241c; box-shadow: inset 0 0 0 1px #fffaf3; }
    .volume { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 5px 2px 0; color: #fffaf3; font-size: 11px; }
    input[type="range"] { width: 100%; height: 18px; margin: 0; accent-color: #e7d5be; }
    .volume-value { width: 25px; text-align: right; font-variant-numeric: tabular-nums; }
    @media (max-width: 260px) { body { padding: 2px 0; } .widget { padding: 6px; } .controls { gap: 3px; } button { min-height: 32px; font-size: 14px; } }
  </style>
</head>
<body>
  <main class="widget" aria-label="Lecteur musical">
    <div class="frame"><div id="player" title="Playlist musicale YouTube"></div></div>
    <p class="status" id="status" role="status" aria-live="polite">Chargement de la playlist…</p>
    <div class="controls" aria-label="Commandes du lecteur">
      <button id="previous" type="button" aria-label="Précédent" title="Précédent" disabled>⏮</button>
      <button id="play-pause" type="button" aria-label="Lecture ou pause" title="Lecture ou pause" disabled>▶</button>
      <button id="next" type="button" aria-label="Suivant" title="Suivant" disabled>⏭</button>
      <button id="shuffle" type="button" aria-label="Lecture aléatoire" aria-pressed="false" title="Lecture aléatoire" disabled>🔀</button>
      <button id="loop" type="button" aria-label="Boucle" aria-pressed="false" title="Boucle" disabled>🔁</button>
    </div>
    <label class="volume" for="volume">
      <span>Volume</span>
      <input id="volume" type="range" min="0" max="100" value="70" aria-label="Volume" disabled>
      <span class="volume-value" id="volume-value">70</span>
    </label>
  </main>
  <script async src="https://www.youtube.com/iframe_api"></script>
  <script>
    const PLAYLIST_ID = 'PLSKDu2RrwS_k';
    const SHUFFLE_KEY = 'hub-music-shuffle';
    const START_HINT = 'Clique une fois sur la vidéo pour démarrer';
    let player = null;
    let playerReady = false;
    let shuffleEnabled = readShuffle();
    let shuffleApplied = false;
    let randomStartCued = false;
    let loopEnabled = false;
    let startCheck = null;

    // Lecture aléatoire activée par défaut ; seul un arrêt explicite est mémorisé.
    function readShuffle() {
      try { return localStorage.getItem(SHUFFLE_KEY) !== 'off'; } catch { return true; }
    }

    function saveShuffle() {
      try { localStorage.setItem(SHUFFLE_KEY, shuffleEnabled ? 'on' : 'off'); } catch {}
    }

    const status = document.getElementById('status');
    const playPause = document.getElementById('play-pause');
    const shuffle = document.getElementById('shuffle');
    const loop = document.getElementById('loop');
    const volume = document.getElementById('volume');
    const volumeValue = document.getElementById('volume-value');
    const frame = document.querySelector('.frame');
    const controls = ['previous', 'play-pause', 'next', 'shuffle', 'loop', 'volume'];

    function resizePlayer() {
      if (playerReady) player.setSize(frame.clientWidth, frame.clientHeight);
    }

    new ResizeObserver(resizePlayer).observe(frame);

    function setControlsEnabled(enabled) {
      controls.forEach((id) => { document.getElementById(id).disabled = !enabled; });
    }

    function onPlayerReady(event) {
      player = event.target;
      playerReady = true;
      resizePlayer();
      player.setVolume(Number(volume.value));
      player.setLoop(loopEnabled);
      player.cuePlaylist({ listType: 'playlist', list: PLAYLIST_ID, index: 0 });
      status.textContent = 'Playlist prête';
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.CUED || event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.PAUSED) {
        setControlsEnabled(true);
      }
      // Le shuffle YouTube ne change pas le premier titre : on recharge la playlist sur un titre
      // aléatoire (sans lecture), puis on active le shuffle une fois ce titre prêt.
      if (event.data === YT.PlayerState.CUED && shuffleEnabled && !shuffleApplied) {
        const total = (player.getPlaylist() || []).length;
        if (!randomStartCued && total > 1) {
          randomStartCued = true;
          player.cuePlaylist({ listType: 'playlist', list: PLAYLIST_ID, index: Math.floor(Math.random() * total) });
        } else {
          shuffleApplied = true;
          player.setShuffle(true);
        }
      }
      if (event.data === YT.PlayerState.PLAYING || event.data === YT.PlayerState.BUFFERING) {
        clearTimeout(startCheck);
        if (status.textContent === START_HINT) status.textContent = 'Lecture en cours';
      }
      playPause.textContent = event.data === YT.PlayerState.PLAYING ? '⏸' : '▶';
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('player', {
        width: '100%',
        height: '200',
        playerVars: { playsinline: 1, controls: 0, listType: 'playlist', list: PLAYLIST_ID },
        events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange, onError: () => { status.textContent = 'YouTube n’a pas pu charger cette playlist'; } },
      });
    };

    document.getElementById('previous').addEventListener('click', () => { if (playerReady) player.previousVideo(); });
    document.getElementById('next').addEventListener('click', () => { if (playerReady) player.nextVideo(); });
    playPause.addEventListener('click', () => {
      if (!playerReady) return;
      if (player.getPlayerState() === YT.PlayerState.PLAYING) { player.pauseVideo(); return; }
      player.playVideo();
      // Dans Notion, l'iframe d'intégration n'autorise pas la lecture automatique :
      // le tout premier démarrage doit venir d'un clic directement sur la vidéo.
      clearTimeout(startCheck);
      startCheck = setTimeout(() => {
        const state = player.getPlayerState();
        if (state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING) {
          status.textContent = START_HINT;
        }
      }, 2500);
    });
    shuffle.setAttribute('aria-pressed', String(shuffleEnabled));
    shuffle.addEventListener('click', () => {
      if (!playerReady) return;
      shuffleEnabled = !shuffleEnabled;
      shuffleApplied = true;
      saveShuffle();
      player.setShuffle(shuffleEnabled);
      shuffle.setAttribute('aria-pressed', String(shuffleEnabled));
      status.textContent = shuffleEnabled ? 'Lecture aléatoire activée' : 'Ordre de la playlist';
    });
    loop.addEventListener('click', () => {
      if (!playerReady) return;
      loopEnabled = !loopEnabled;
      player.setLoop(loopEnabled);
      loop.setAttribute('aria-pressed', String(loopEnabled));
      status.textContent = loopEnabled ? 'Boucle activée' : 'Boucle désactivée';
    });
    volume.addEventListener('input', () => {
      volumeValue.textContent = volume.value;
      if (playerReady) player.setVolume(Number(volume.value));
    });
  </script>
</body>
</html>
