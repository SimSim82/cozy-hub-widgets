<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horloge du HUB</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#191919;overflow:hidden}main{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:4px}.card{position:relative;background:#51362a;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff9ef;overflow:hidden}.card:after{content:"";position:absolute;top:50%;left:0;width:100%;height:1px;background:#24191088;box-shadow:0 1px #ffffff08}.number{font-family:Impact,'Arial Narrow',sans-serif;font-weight:900;font-size:clamp(38px,35vw,160px);line-height:1;letter-spacing:-.03em;transform:scaleX(.85)}small{position:absolute;bottom:10px;left:8px;right:6px;font:700 clamp(10px,4.5vw,16px)/1.1 'Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em}</style><main aria-label="Heure et date"><div class="card"><span class="number" id="h">00</span><small id="date"></small></div><div class="card"><span class="number" id="m">00</span><small id="day"></small></div></main><script>function tick(){let d=new Date(),t=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);document.getElementById('h').textContent=t.find(x=>x.type==='hour').value;document.getElementById('m').textContent=t.find(x=>x.type==='minute').value;document.getElementById('date').textContent=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',day:'numeric',month:'short'}).format(d);document.getElementById('day').textContent=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',weekday:'long'}).format(d)}tick();setInterval(tick,1000)</script></html>
